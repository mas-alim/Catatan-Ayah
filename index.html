<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Transaksi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-600 min-h-screen flex items-center justify-center p-4">

  <!-- Modal Container -->
  <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-5 font-sans">
    
    <!-- Modal Header -->
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-medium text-gray-800">Detail Transaksi</h2>
      <button class="w-9 h-9 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Detail Card -->
    <div class="border border-gray-200 rounded-2xl p-5 bg-white space-y-4">
      
      <!-- Profile Header -->
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-full bg-slate-400 text-white font-semibold flex items-center justify-center text-sm border-2 border-slate-300">
          AIN
        </div>
        <div>
          <h3 class="text-lg font-bold text-gray-900 leading-tight">Angsus</h3>
          <span class="inline-block px-2.5 py-0.5 text-[11px] font-medium text-emerald-700 bg-emerald-50 rounded-full">
            Active
          </span>
        </div>
      </div>

      <!-- Transaction Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-xs font-semibold text-gray-800 border-b border-gray-200">
              <th class="py-2.5 px-2">Tgl. Transaksi</th>
              <th class="py-2.5 px-2">Keterangan</th>
              <th class="py-2.5 px-2 text-right">Debit</th>
              <th class="py-2.5 px-2 text-right">Kredit</th>
            </tr>
          </thead>
          <tbody class="text-xs divide-y divide-gray-50">
            <tr class="bg-gray-50/70">
              <td class="py-3 px-2 text-gray-700">1-Sep-2026</td>
              <td class="py-3 px-2 text-gray-800">Ibu</td>
              <td class="py-3 px-2 text-right"></td>
              <td class="py-3 px-2 text-right font-medium text-[#7D2D2B]">Rp. 28.500</td>
            </tr>
            <tr>
              <td class="py-3 px-2 text-gray-700">1-Sep-2026</td>
              <td class="py-3 px-2 text-gray-800">Ibu</td>
              <td class="py-3 px-2 text-right"></td>
              <td class="py-3 px-2 text-right font-medium text-[#7D2D2B]">Rp. 30.000</td>
            </tr>
            <tr class="bg-gray-50/70">
              <td class="py-3 px-2 text-gray-700">2-Sep-2026</td>
              <td class="py-3 px-2 text-gray-800">Angsuran ke 1</td>
              <td class="py-3 px-2 text-right font-medium text-emerald-600">Rp. 10.000</td>
              <td class="py-3 px-2 text-right"></td>
            </tr>
            <tr>
              <td class="py-3 px-2 text-gray-700">2-Sep-2026</td>
              <td class="py-3 px-2 text-gray-800">Angsuran ke 2</td>
              <td class="py-3 px-2 text-right font-medium text-emerald-600">Rp. 5.000</td>
              <td class="py-3 px-2 text-right"></td>
            </tr>
            <tr class="bg-gray-50/70">
              <td class="py-3 px-2 text-gray-700">2-Sep-2026</td>
              <td class="py-3 px-2 text-gray-800">Sosis</td>
              <td class="py-3 px-2 text-right"></td>
              <td class="py-3 px-2 text-right font-medium text-[#7D2D2B]">Rp. 10.000</td>
            </tr>
          </tbody>
        </table>
      </div>

      <hr class="border-gray-200" />

      <!-- Sisa Tagihan -->
      <div class="flex justify-between items-center pt-1">
        <span class="text-sm font-semibold text-gray-800">Sisa Tagihan</span>
        <span class="text-sm font-bold text-[#7D2D2B]">Rp. 53.500</span>
      </div>

    </div>

    <!-- Action Buttons -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
      <button class="flex items-center justify-center gap-2 bg-[#0B2545] hover:bg-[#071930] text-white text-xs font-medium py-3 px-3 rounded-xl transition shadow-sm">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span>Download Nota</span>
      </button>

      <button class="flex items-center justify-center gap-2 bg-[#2B3A4A] hover:bg-[#1E2A37] text-white text-xs font-medium py-3 px-3 rounded-xl transition shadow-sm">
        <i data-lucide="paperclip" class="w-4 h-4"></i>
        <span>Download Lampiran</span>
      </button>

      <button class="flex items-center justify-center gap-2 bg-[#8B2626] hover:bg-[#701E1E] text-white text-xs font-medium py-3 px-3 rounded-xl transition shadow-sm">
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        <span>Hapus</span>
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
