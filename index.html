    <!-- SCRIPT FIREBASE & UTILS -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCIjl-mXei1es5yj_sQLW6Cq4EzTqkrw_A",
            authDomain: "catatan-ayah.firebaseapp.com",
            databaseURL: "https://catatan-ayah-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "catatan-ayah",
            storageBucket: "catatan-ayah.firebasestorage.app",
            messagingSenderId: "1075310951800",
            appId: "1:1075310951800:web:30aa475aba2d3186d95c8d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const appRef = ref(db, 'catatanAyahData');

        let currentTab = 'beranda';
        let txFilter = 'semua';
        let data = { transactions: [], needs: [] };
        
        let enteredPin = "";
        let savedPin = localStorage.getItem('user_pin_ayah');
        let activePayMode = 'cicil';

        const TX_STATUS = {
            BELUM: 'Belum Lunas',
            CICIL: 'Dicicil',
            LUNAS: 'Lunas'
        };

        // --- SECURITY LOGIC ---
        function checkPinSetup() {
            const title = document.getElementById('pin-title');
            const subtitle = document.getElementById('pin-subtitle');
            
            if (!savedPin) {
                title.textContent = "Buat PIN Baru";
                subtitle.textContent = "Masukkan 6 angka untuk keamanan aplikasi";
            } else {
                title.textContent = "Masukkan PIN Keamanan";
                subtitle.textContent = "Masukkan 6 digit angka PIN Anda";
            }
        }

        function pressPin(num) {
            if (enteredPin.length < 6) {
                enteredPin += num;
                updatePinDots();
            }
            if (enteredPin.length === 6) {
                setTimeout(verifyPin, 100);
            }
        }

        function clearPin() {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('#pin-dots div');
            dots.forEach((dot, index) => {
                if (index < enteredPin.length) {
                    dot.classList.add('bg-white');
                    dot.classList.remove('bg-transparent');
                } else {
                    dot.classList.remove('bg-white');
                    dot.classList.add('bg-transparent');
                }
            });
        }

        function verifyPin() {
            if (!savedPin) {
                localStorage.setItem('user_pin_ayah', enteredPin);
                savedPin = enteredPin;
                unlockApp();
            } else if (enteredPin === savedPin) {
                unlockApp();
            } else {
                alert("PIN Salah! Silakan coba lagi.");
                enteredPin = "";
                updatePinDots();
            }
        }

        function unlockApp() {
            document.getElementById('pin-screen').classList.add('hidden');
            initApp();
        }

        // --- FIREBASE SINKRONISASI ---
        function initApp() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('id-ID', options);
            
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('tx_date').min = todayStr;
            document.getElementById('nd_date').min = todayStr;

            const syncStatus = document.getElementById('sync-status');
            
            onValue(appRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    data = {
                        transactions: val.transactions || [],
                        needs: val.needs || []
                    };
                } else {
                    data = { transactions: [], needs: [] };
                }
                syncStatus.className = "w-3 h-3 rounded-full bg-green-300 shadow-sm";
                syncStatus.title = "Tersinkron dengan Cloud";
                renderApp();
            }, (error) => {
                console.error("Firebase error: ", error);
                syncStatus.className = "w-3 h-3 rounded-full bg-red-400";
                syncStatus.title = "Koneksi Cloud Gagal!";
            });
        }

        function pushDataToCloud() {
            set(appRef, data);
        }

        // --- UTILS ---
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const formatDate = (dateStr) => {
            if(!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        };

        const calculateDaysDiff = (dateStr) => {
            const due = new Date(dateStr);
            const today = new Date();
            due.setHours(0,0,0,0); today.setHours(0,0,0,0);
            const diffTime = due - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substring(2);

        function compressImage(file, callback) {
            if (!file) return callback(null);
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500;
                    const MAX_HEIGHT = 500;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
                    callback(dataUrl);
                }
            }
        }

        // --- UI NAVIGATION & MODALS ---
        function switchTab(tab) {
            currentTab = tab;
            ['beranda', 'transaksi', 'kebutuhan'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.classList.add('text-green-600');
                    btn.classList.remove('text-gray-400');
                } else {
                    btn.classList.remove('text-green-600');
                    btn.classList.add('text-gray-400');
                }
            });
            renderApp();
        }

        function setTxFilter(filter) {
            txFilter = filter;
            renderApp();
        }

        function openModal(id) {
            document.body.classList.add('modal-open');
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.body.classList.remove('modal-open');
            document.getElementById(id).classList.add('hidden');
            if(id === 'modal-add-transaction') document.getElementById('form-transaction').reset();
            if(id === 'modal-add-need') document.getElementById('form-need').reset();
            if(id === 'modal-payment') document.getElementById('form-payment').reset();
        }

        function viewPhoto(dataUrl) {
            document.getElementById('photo-preview-img').src = dataUrl;
            openModal('modal-photo');
        }

        // --- RENDER ENGINE ---
        function renderApp() {
            const container = document.getElementById('app-container');
            container.innerHTML = ''; 
            
            if (currentTab === 'beranda') container.innerHTML = buildBeranda();
            else if (currentTab === 'transaksi') container.innerHTML = buildTransaksi();
            else if (currentTab === 'kebutuhan') container.innerHTML = buildKebutuhan();
        }

        function buildBeranda() {
            let totalHutang = 0;
            let totalPiutang = 0;
            const upcoming = [];

            data.transactions.forEach(tx => {
                const paidTotal = (tx.history || []).reduce((acc, h) => acc + Number(h.amount), 0);
                const sisa = Number(tx.amount) - paidTotal;

                if(tx.status !== TX_STATUS.LUNAS && sisa > 0) {
                    if(tx.type === 'hutang') totalHutang += sisa;
                    if(tx.type === 'piutang') totalPiutang += sisa;
                    
                    const days = calculateDaysDiff(tx.dueDate);
                    if(days >= 0 && days <= 3) {
                        upcoming.push({...tx, days, remaining: sisa});
                    }
                }
            });

            const saldoBersih = totalPiutang - totalHutang;
            const isDefisit = saldoBersih < 0;

            upcoming.sort((a,b) => a.days - b.days);

            let html = `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-6">
                    <p class="text-gray-500 text-sm mb-1">Saldo Bersih (Piutang - Hutang)</p>
                    <h2 class="text-3xl font-bold ${isDefisit ? 'text-red-500' : 'text-green-600'} mb-4">
                        ${formatRupiah(saldoBersih)}
                    </h2>
                    
                    <div class="flex gap-4">
                        <div class="flex-1 bg-red-50 p-3 rounded-xl border border-red-100">
                            <div class="flex items-center gap-1 text-red-500 mb-1">
                                <i class="ph ph-arrow-down-right"></i>
                                <span class="text-xs font-semibold">Total Sisa Hutang</span>
                            </div>
                            <p class="font-bold text-gray-800">${formatRupiah(totalHutang)}</p>
                        </div>
                        <div class="flex-1 bg-green-50 p-3 rounded-xl border border-green-100">
                            <div class="flex items-center gap-1 text-green-600 mb-1">
                                <i class="ph ph-arrow-up-right"></i>
                                <span class="text-xs font-semibold">Total Sisa Piutang</span>
                            </div>
                            <p class="font-bold text-gray-800">${formatRupiah(totalPiutang)}</p>
                        </div>
                    </div>
                </div>

                <div class="mb-4 flex justify-between items-end">
                    <h3 class="font-bold text-gray-800 text-lg">Pengingat Jatuh Tempo (H-3)</h3>
                </div>
            `;

            if (upcoming.length === 0) {
                html += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center text-gray-400">
                        <i class="ph ph-check-circle text-4xl mb-2 text-green-500"></i>
                        <p class="text-sm">Tidak ada tagihan jatuh tempo dalam 3 hari ke depan.</p>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                upcoming.forEach(item => {
                    const isHutang = item.type === 'hutang';
                    const iconColor = isHutang ? 'text-red-500 bg-red-100' : 'text-green-600 bg-green-100';
                    const titleText = isHutang ? 'Bayar ke' : 'Tagih ke';
                    const hariText = item.days === 0 ? 'Hari ini' : `H-${item.days}`;

                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-full flex items-center justify-center ${iconColor}">
                                    <i class="ph ${isHutang ? 'ph-arrow-down' : 'ph-arrow-up'} text-xl"></i>
                                </div>
                                <div>
                                    <p class="text-xs text-gray-500">${titleText}</p>
                                    <p class="font-bold text-gray-800 leading-tight">${item.contact}</p>
                                    <p class="text-xs font-medium text-orange-500 mt-1">
                                        <i class="ph ph-clock"></i> Jatuh Tempo: ${hariText}
                                    </p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-bold ${isHutang ? 'text-red-500' : 'text-green-600'}">${formatRupiah(item.remaining)}</p>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            return html;
        }

        function buildTransaksi() {
            let filteredTx = data.transactions;
            if (txFilter === 'hutang') filteredTx = data.transactions.filter(t => t.type === 'hutang');
            if (txFilter === 'piutang') filteredTx = data.transactions.filter(t => t.type === 'piutang');

            filteredTx = [...filteredTx].reverse();

            let html = `
                <div class="flex gap-2 mb-4 bg-white p-1 rounded-xl shadow-sm border border-gray-100">
                    <button onclick="setTxFilter('semua')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${txFilter === 'semua' ? 'bg-green-100 text-green-700 font-bold' : 'text-gray-500'}">Semua</button>
                    <button onclick="setTxFilter('hutang')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${txFilter === 'hutang' ? 'bg-red-100 text-red-700 font-bold' : 'text-gray-500'}">Hutang</button>
                    <button onclick="setTxFilter('piutang')" class="flex-1 py-2 text-sm font-medium rounded-lg transition ${txFilter === 'piutang' ? 'bg-green-100 text-green-700 font-bold' : 'text-gray-500'}">Piutang</button>
                </div>
            `;

            if (filteredTx.length === 0) {
                html += `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="ph ph-folder-open text-5xl mb-2"></i>

                    </div>

            } else {
                html += `<div class="space-y-4">`;
                filteredTx.forEach(tx => {
                    const isHutang = tx.type === 'hutang';

                    const sisa = Number(tx.amount) - paidTotal;

                    let statusColor = 'bg-gray-100 text-gray-600';
                    if (tx.status === TX_STATUS.CICIL) statusColor = 'bg-orange-100 text-orange-600 font-semibold';
                    if (tx.status === TX_STATUS.LUNAS) statusColor = 'bg-green-100 text-green-600 font-semibold';

                    html += `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden relative" id="card-tx-${tx.id}">
                            <div class="absolute left-0 top-0 bottom-0 w-1.5 ${isHutang ? 'bg-red-400' : 'bg-green-500'}"></div>
                            
                            <div class="p-4 pl-5">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs font-semibold uppercase tracking-wider ${isHutang ? 'text-red-500' : 'text-green-600'}">
                                                ${isHutang ? 'HUTANG KE' : 'PIUTANG DARI'}
                                            </span>
                                            <span class="text-[10px] px-2 py-0.5 rounded-full ${statusColor}">${tx.status}</span>
                                        </div>
                                        <h3 class="font-bold text-gray-800 text-lg leading-tight mt-1">${tx.contact}</h3>
                                        ${tx.description ? `<p class="text-xs text-gray-500 mt-0.5"><i class="ph ph-note"></i> ${tx.description}</p>` : ''}
                                    </div>
                                    <div class="text-right">
                                        <p class="font-bold text-gray-800">${formatRupiah(tx.amount)}</p>
                                        ${tx.status !== TX_STATUS.LUNAS ? `<p class="text-xs text-red-500 font-medium">Sisa: ${formatRupiah(sisa)}</p>` : '<p class="text-xs text-green-600 font-medium">Lunas</p>'}
                                    </div>
                                </div>
                                
                                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-100">
                                    <p class="text-xs text-gray-400"><i class="ph ph-calendar"></i> ${formatDate(tx.dueDate)}</p>
                                    
                                    <div class="flex gap-2">
                                        ${tx.status !== TX_STATUS.LUNAS ? `
                                            <button onclick="openPaymentModal('${tx.id}')" class="px-3 py-1.5 bg-green-600 text-white rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-green-700 active:scale-95 transition">
                                                <i class="ph ph-currency-dollar"></i> Bayar
                                            </button>
                                        ` : ''}

                                        <button onclick="openDetailModal('${tx.id}')" class="px-3 py-1.5 bg-blue-50 text-blue-600 rounded-lg text-xs font-bold flex items-center gap-1 hover:bg-blue-100 transition">
                                            <i class="ph ph-info"></i> Detail
                                        </button>

                                        <button onclick="downloadReceipt('${tx.id}')" class="p-1.5 text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition" title="Download Nota">
                                            <i class="ph ph-download-simple text-base"></i>
                                        </button>

                                        <button onclick="confirmDelete('tx', '${tx.id}')" class="p-1.5 text-red-500 bg-red-50 rounded-lg hover:bg-red-100 transition">
                                            <i class="ph ph-trash text-base"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            return html;
        }

        function buildKebutuhan() {
            const needs = [...data.needs].reverse();
            let totalBulanIni = 0;
            
            needs.forEach(n => {
                if(n.status !== TX_STATUS.LUNAS) totalBulanIni += Number(n.amount);
            });

            let html = `
                <div class="bg-emerald-600 text-white p-5 rounded-2xl shadow-sm border border-emerald-700 mb-6 flex justify-between items-center">
                    <div>
                        <p class="text-emerald-100 text-sm mb-1">Total Tagihan (Belum Lunas)</p>
                        <h2 class="text-2xl font-bold">${formatRupiah(totalBulanIni)}</h2>
                    </div>
                    <button onclick="openModal('modal-add-need')" class="bg-white text-emerald-700 px-4 py-2.5 rounded-xl shadow-lg hover:bg-gray-50 active:scale-95 transition flex items-center gap-1">
                        <i class="ph ph-plus-circle text-xl"></i> <span class="text-sm font-bold">Baru</span>
                    </button>
                </div>

                <div class="flex justify-between items-end mb-3">
                    <h3 class="font-bold text-gray-800 text-lg">Daftar Tagihan & Rencana</h3>
                </div>
            `;

            if (needs.length === 0) {
                html += `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="ph ph-list-dashes text-5xl mb-2"></i>
                        <p>Belum ada catatan tagihan.</p>
                    </div>
                `;
            } else {
                html += `<div class="space-y-3">`;
                needs.forEach(nd => {
                    const isLunas = nd.status === TX_STATUS.LUNAS;
                    
                    html += `
                        <div class="bg-white p-4 rounded-xl shadow-sm border ${isLunas ? 'border-green-200 opacity-60' : 'border-gray-100'} flex gap-3 items-center">
                            <button onclick="toggleNeedStatus('${nd.id}')" class="flex-shrink-0 w-8 h-8 rounded-full border-2 flex items-center justify-center transition ${isLunas ? 'bg-green-600 border-green-600 text-white' : 'border-gray-300 text-transparent hover:border-green-400'}">
                                <i class="ph ph-check font-bold"></i>
                            </button>

                            <div class="flex-1">
                                <h4 class="font-bold text-gray-800 ${isLunas ? 'line-through text-gray-500' : ''}">${nd.description}</h4>
                                <div class="flex justify-between mt-1 items-center">
                                    <p class="text-xs text-gray-500"><i class="ph ph-calendar"></i> ${formatDate(nd.dueDate)}</p>
                                    <p class="font-bold text-green-700 ${isLunas ? 'text-gray-400' : ''}">${formatRupiah(nd.amount)}</p>
                                </div>
                            </div>

                            <button onclick="confirmDelete('nd', '${nd.id}')" class="flex-shrink-0 p-2 text-gray-400 hover:text-red-500">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            return html;
        }

        // --- ACTION HANDLERS ---
        function saveTransaction(e) {
            e.preventDefault();
            
            const type = document.querySelector('input[name="tx_type"]:checked').value;
            const name = document.getElementById('tx_name').value;
            const amount = document.getElementById('tx_amount').value;
            const date = document.getElementById('tx_date').value;
            const desc = document.getElementById('tx_desc').value;
            const fileInput = document.getElementById('tx_image');
            const file = fileInput.files[0];

            const processSave = (base64Img) => {
                const newTx = {
                    id: generateId(),
                    type: type,
                    contact: name,
                    amount: Number(amount),
                    dueDate: date,
                    description: desc || '',
                    status: TX_STATUS.BELUM,
                    image: base64Img,
                    history: [],
                    createdAt: new Date().toISOString()
                };

                data.transactions.push(newTx);
                pushDataToCloud();
                closeModal('modal-add-transaction');
            };

            if (file) {
                compressImage(file, processSave);
            } else {
                processSave(null);
            }
        }

        function openPaymentModal(txId) {
            const tx = data.transactions.find(t => t.id === txId);
            if (!tx) return;

            const paidTotal = (tx.history || []).reduce((acc, h) => acc + Number(h.amount), 0);
            const sisa = Number(tx.amount) - paidTotal;

            document.getElementById('pay_tx_id').value = tx.id;
            document.getElementById('pay-subheading').textContent = `${tx.type === 'hutang' ? 'Hutang ke' : 'Piutang dari'}: ${tx.contact}`;
            document.getElementById('pay-remaining-amount').textContent = formatRupiah(sisa);
            document.getElementById('pay_amount').value = '';
            document.getElementById('pay_amount').max = sisa;
            document.getElementById('pay_note').value = '';
            document.getElementById('pay_image').value = '';

            setPayMode('cicil');
            openModal('modal-payment');
        }

        function setPayMode(mode) {
            activePayMode = mode;
            const btnCicil = document.getElementById('btn-pay-cicil');
            const btnLunas = document.getElementById('btn-pay-lunas');
            const txId = document.getElementById('pay_tx_id').value;
            const tx = data.transactions.find(t => t.id === txId);

            if (mode === 'cicil') {
                btnCicil.className = "flex-1 py-2 text-sm font-medium rounded-md bg-orange-500 text-white transition";
                btnLunas.className = "flex-1 py-2 text-sm font-medium rounded-md text-gray-500 transition";
                document.getElementById('pay_amount').value = '';
                document.getElementById('pay_amount').readOnly = false;
            } else {
                btnLunas.className = "flex-1 py-2 text-sm font-medium rounded-md bg-green-600 text-white transition";
                btnCicil.className = "flex-1 py-2 text-sm font-medium rounded-md text-gray-500 transition";
                
                if(tx) {
                    const paidTotal = (tx.history || []).reduce((acc, h) => acc + Number(h.amount), 0);
                    const sisa = Number(tx.amount) - paidTotal;
                    document.getElementById('pay_amount').value = sisa;
                    document.getElementById('pay_amount').readOnly = true;
                }
            }
        }

        function savePayment(e) {
            e.preventDefault();
            const txId = document.getElementById('pay_tx_id').value;
            const amount = Number(document.getElementById('pay_amount').value);
            const note = document.getElementById('pay_note').value;
            const fileInput = document.getElementById('pay_image');
            const file = fileInput.files[0];

            const tx = data.transactions.find(t => t.id === txId);
            if (!tx) return;

            const processPayment = (base64Img) => {
                if (!tx.history) tx.history = [];

                tx.history.push({
                    id: generateId(),
                    amount: amount,
                    note: note || (activePayMode === 'lunas' ? 'Pelunasan Total' : 'Pembayaran Cicilan'),
                    date: new Date().toISOString(),
                    image: base64Img
                });

                const totalPaid = tx.history.reduce((acc, h) => acc + Number(h.amount), 0);

                if (totalPaid >= Number(tx.amount)) {
                    tx.status = TX_STATUS.LUNAS;
                } else {
                    tx.status = TX_STATUS.CICIL;
                }

                pushDataToCloud();
                closeModal('modal-payment');
            };

            if (file) {
                compressImage(file, processPayment);
            } else {
                processPayment(null);
            }
        }

        function openDetailModal(txId) {
            const tx = data.transactions.find(t => t.id === txId);
            if (!tx) return;

            const paidTotal = (tx.history || []).reduce((acc, h) => acc + Number(h.amount), 0);
            const sisa = Math.max(0, Number(tx.amount) - paidTotal);
            const percent = Math.min(100, Math.round((paidTotal / Number(tx.amount)) * 100));
            const isHutang = tx.type === 'hutang';

            let historyHtml = '';
            if (!tx.history || tx.history.length === 0) {
                historyHtml = `<p class="text-xs text-gray-400 italic">Belum ada riwayat pembayaran.</p>`;
            } else {
                historyHtml = tx.history.map(h => `
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 flex justify-between items-center text-xs">
                        <div>
                            <p class="font-bold text-gray-800">${formatRupiah(h.amount)}</p>
                            <p class="text-gray-500">${h.note}</p>
                            <p class="text-[10px] text-gray-400 mt-0.5">${formatDate(h.date)}</p>
                        </div>
                        ${h.image ? `
                            <button onclick="viewPhoto('${h.image}')" class="p-2 text-green-600 bg-white rounded-md border border-gray-200 flex items-center gap-1 hover:bg-green-50">
                                <i class="ph ph-image text-base"></i> Struk
                            </button>
                        ` : ''}
                    </div>
                `).join('');
            }

            const content = `
                <div class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                    <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full ${isHutang ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}">
                        ${isHutang ? 'HUTANG KE' : 'PIUTANG DARI'}
                    </span>
                    <h3 class="text-xl font-bold text-gray-800 mt-1">${tx.contact}</h3>
                    ${tx.description ? `<p class="text-xs text-gray-600 mt-1"><i class="ph ph-note"></i> ${tx.description}</p>` : ''}
                    <p class="text-xs text-gray-500 mt-1">Jatuh Tempo: <b>${formatDate(tx.dueDate)}</b></p>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs">
                        <span class="text-gray-500">Progres Pembayaran</span>
                        <span class="font-bold text-gray-700">${percent}%</span>
                    </div>
                    <div class="w-full bg-gray-200 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-green-600 h-2.5 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
                    </div>
                    <div class="flex justify-between text-xs pt-1">
                        <span>Dibayar: <b>${formatRupiah(paidTotal)}</b></span>
                        <span class="text-red-500">Sisa: <b>${formatRupiah(sisa)}</b></span>
                    </div>
                </div>

                ${tx.image ? `
                    <div>
                        <p class="text-xs font-semibold text-gray-700 mb-1">Bukti Foto Awalan:</p>
                        <button onclick="viewPhoto('${tx.image}')" class="w-full py-2 bg-gray-100 rounded-lg text-xs text-green-600 font-bold flex items-center justify-center gap-1 hover:bg-gray-200">
                            <i class="ph ph-image text-base"></i> Lihat Bukti Awalan
                        </button>
                    </div>
                ` : ''}

                <div>
                    <h4 class="text-xs font-bold text-gray-700 mb-2">Riwayat Cicilan & Pelunasan</h4>
                    <div class="space-y-2 max-h-40 overflow-y-auto">
                        ${historyHtml}
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button onclick="downloadReceipt('${tx.id}')" class="flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1 hover:bg-blue-700 transition">
                        <i class="ph ph-download-simple text-base"></i> Download Nota
                    </button>
                    ${tx.status !== TX_STATUS.LUNAS ? `
                        <button onclick="closeModal('modal-detail'); openPaymentModal('${tx.id}')" class="flex-1 py-2.5 bg-green-600 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-1 hover:bg-green-700 transition">
                            <i class="ph ph-currency-dollar text-base"></i> Catat Bayar
                        </button>
                    ` : ''}
                </div>
            `;

            document.getElementById('detail-content').innerHTML = content;
            openModal('modal-detail');
        }

        function downloadReceipt(txId) {
            const tx = data.transactions.find(t => t.id === txId);
            if (!tx) return;

            const paidTotal = (tx.history || []).reduce((acc, h) => acc + Number(h.amount), 0);
            const sisa = Math.max(0, Number(tx.amount) - paidTotal);

            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            tempDiv.style.width = '350px';
            tempDiv.style.padding = '20px';
            tempDiv.style.background = '#ffffff';
            tempDiv.style.borderRadius = '12px';
            tempDiv.style.fontFamily = 'sans-serif';

            tempDiv.innerHTML = `
                <div style="text-align: center; border-bottom: 2px dashed #ccc; padding-bottom: 12px; margin-bottom: 12px;">
                    <h2 style="margin: 0; font-size: 18px; color: #16a34a;">BUKU CATATAN AYAH</h2>
                    <p style="margin: 4px 0 0 0; font-size: 11px; color: #666;">Nota Bukti Transaksi Keuangan</p>
                </div>
                <div style="font-size: 12px; color: #333; line-height: 1.6;">
                    <p style="margin: 2px 0;"><b>Tipe:</b> ${tx.type === 'hutang' ? 'HUTANG' : 'PIUTANG'}</p>
                    <p style="margin: 2px 0;"><b>Nama Pihak:</b> ${tx.contact}</p>
                    ${tx.description ? `<p style="margin: 2px 0;"><b>Keterangan:</b> ${tx.description}</p>` : ''}
                    <p style="margin: 2px 0;"><b>Tanggal Buat:</b> ${formatDate(tx.createdAt || new Date())}</p>
                    <p style="margin: 2px 0;"><b>Jatuh Tempo:</b> ${formatDate(tx.dueDate)}</p>
                    <hr style="border: none; border-top: 1px solid #eee; margin: 8px 0;">
                    <p style="margin: 2px 0;"><b>Total Nominal:</b> ${formatRupiah(tx.amount)}</p>
                    <p style="margin: 2px 0; color: #16a34a;"><b>Sudah Dibayar:</b> ${formatRupiah(paidTotal)}</p>
                    <p style="margin: 2px 0; color: #dc2626;"><b>Sisa Tagihan:</b> ${formatRupiah(sisa)}</p>
                    <p style="margin: 2px 0;"><b>Status:</b> ${tx.status}</p>
                </div>
                <div style="text-align: center; margin-top: 16px; font-size: 10px; color: #999;">
                    Dicetak secara otomatis via Aplikasi Catatan Ayah
                </div>
            `;

            document.body.appendChild(tempDiv);

            html2canvas(tempDiv).then(canvas => {
                const link = document.createElement('a');
                link.download = `Nota_${tx.contact}_${tx.type}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                document.body.removeChild(tempDiv);
            });
        }

        function saveNeed(e) {
            e.preventDefault();
            const desc = document.getElementById('nd_desc').value;
            const amount = document.getElementById('nd_amount').value;
            const date = document.getElementById('nd_date').value;

            const newNeed = {
                id: generateId(),
                description: desc,
                amount: Number(amount),
                dueDate: date,
                status: TX_STATUS.BELUM,
                createdAt: new Date().toISOString()
            };

            data.needs.push(newNeed);
            pushDataToCloud();
            closeModal('modal-add-need');
        }

        function toggleNeedStatus(id) {
            const nd = data.needs.find(n => n.id === id);
            if (nd) {
                nd.status = (nd.status === TX_STATUS.LUNAS) ? TX_STATUS.BELUM : TX_STATUS.LUNAS;
                pushDataToCloud();
            }
        }

        let deleteTarget = { type: null, id: null };
        function confirmDelete(type, id) {
            deleteTarget = { type, id };
            openModal('modal-confirm');
            document.getElementById('btn-confirm-delete').onclick = () => {
                if(deleteTarget.type === 'tx') {
                    data.transactions = data.transactions.filter(t => t.id !== deleteTarget.id);
                } else if(deleteTarget.type === 'nd') {
                    data.needs = data.needs.filter(n => n.id !== deleteTarget.id);
                }
                pushDataToCloud();
                closeModal('modal-confirm');
            };
        }

        // BIND KE GLOBAL WINDOW
        window.pressPin = pressPin;
        window.clearPin = clearPin;
        window.switchTab = switchTab;
        window.setTxFilter = setTxFilter;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.viewPhoto = viewPhoto;
        window.saveTransaction = saveTransaction;
        window.openPaymentModal = openPaymentModal;
        window.setPayMode = setPayMode;
        window.savePayment = savePayment;
        window.openDetailModal = openDetailModal;
        window.downloadReceipt = downloadReceipt;
        window.saveNeed = saveNeed;
        window.toggleNeedStatus = toggleNeedStatus;
        window.confirmDelete = confirmDelete;

        document.addEventListener('DOMContentLoaded', checkPinSetup);
    </script>
</body>
</html>
