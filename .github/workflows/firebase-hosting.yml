name: Deploy Catatan Utang to Firebase Hosting

on:
  push:
    branches:
      - catatan-utang-multitenant
    paths:
      - "index.html"
      - "app.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "offline.html"
      - "icons/**"

permissions:
  contents: read

concurrency:
  group: firebase-hosting-catatan-utang
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: catatan-utang-prod
      url: https://catatan-utang-prod.web.app
    steps:
      - name: Checkout Catatan Utang branch
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const blocks = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const match of blocks) {
            const attributes = match[1] || '';
            const source = match[2] || '';
            if (/\bsrc\s*=/.test(attributes) || !source.trim()) continue;
            const moduleScript = /\btype\s*=\s*["']module["']/i.test(attributes);
            const extension = moduleScript ? 'mjs' : 'js';
            fs.writeFileSync('/tmp/catatan-utang-inline-' + checked + '.' + extension, source);
            checked++;
          }
          if (!checked) throw new Error('No inline JavaScript blocks were found.');
          console.log('Prepared ' + checked + ' inline JavaScript block(s) for syntax validation.');
          NODE
          for script in /tmp/catatan-utang-inline-*.mjs /tmp/catatan-utang-inline-*.js; do
            [ -f "$script" ] || continue
            echo "Checking $script"
            node --check "$script"
          done
          node --check sw.js

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATATAN_UTANG_PROD }}"
          channelId: live
          projectId: catatan-utang-prod
