name: Deploy Catatan Utang to Firebase Hosting

on:
  push:
    branches:
      - catatan-utang-multitenant
    paths:
      - "index.html"
      - "app.css"
      - "manifest.webmanifest"
      - "sw.js"
      - "offline.html"
      - "icons/**"

permissions:
  contents: read

concurrency:
  group: firebase-hosting-catatan-utang
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Catatan Utang branch
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_CATATAN_UTANG_PROD }}"
          channelId: live
          projectId: catatan-utang-prod
