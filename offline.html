<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16a34a">
  <title>Offline — Catatan Utang</title>
  <link rel="icon" href="./icons/icon-192.png">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f4f6;color:#1f2937}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 36px #00000012;text-align:center}
    img{width:72px;height:72px}h1{font-size:1.35rem;margin:16px 0 8px}p{font-size:.95rem;line-height:1.65;color:#6b7280}
    button{border:0;border-radius:12px;background:#16a34a;color:white;font-weight:700;padding:12px 18px;cursor:pointer;margin-top:8px}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="Ikon Catatan Utang">
    <h1>Anda sedang offline</h1>
    <p>Catatan Utang memerlukan koneksi internet untuk login dan memuat data dari Firebase. Demi menjaga privasi, transaksi tidak disimpan untuk digunakan secara offline.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
